<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="background-color: bisque; font-family: sans-serif">
    <div
      style="
        background-color: white;
        width: 360px;
        border-radius: 16px;
        padding: 20px 20px;
      "
    >
      <p>Зорилго:</p>
      <h1>Нэвтрэх</h1>
      <p>Имэйл</p>
      <input
        placeholder="you@mail.com"
        style="width: 342px; padding: 6px"
        type="email"
      />
      <p>Нууц үг</p>
      <input
        placeholder="********"
        style="display: block; width: 342px; padding: 6px"
        type="password"
      />
      <a href="" style="display: block; margin: 10px 0px"
        >Нууц үгээ мартсан уу?</a
      >
      <button
        style="
          width: 360px;
          padding: 12px;
          color: white;
          background-color: rgb(49, 116, 205);
          border-radius: 10px;
        "
      >
        Нэвтрэх
      </button>
      <div style="margin-top: 8px">
        <p style="display: inline">Бүртгэлгүй юу?</p>
        <a href="">
          <strong>Бүртгүүлэх</strong>
        </a>
      </div>
    </div>
  </body>
</html>
